const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function descifrar(paquete, contrasena) {
  const enc = new TextEncoder();
  const sal = b64(paquete.sal), nonce = b64(paquete.nonce), datos = b64(paquete.datos), sello = b64(paquete.sello);
  const base = await crypto.subtle.importKey("raw", enc.encode(contrasena), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name: "PBKDF2", hash: "SHA-256", salt: sal, iterations: paquete.it}, base, 512));
  const hm = (k, usos) => crypto.subtle.importKey("raw", k, {name: "HMAC", hash: "SHA-256"}, false, usos);
  const kCif = await hm(bits.slice(0, 32), ["sign"]), kAut = await hm(bits.slice(32), ["verify"]);
  const firmado = new Uint8Array(sal.length + nonce.length + datos.length);
  firmado.set(sal); firmado.set(nonce, sal.length); firmado.set(datos, sal.length + nonce.length);
  if (!await crypto.subtle.verify("HMAC", kAut, sello, firmado)) return null;
  const bloques = Math.ceil(datos.length / 32), tareas = [];
  for (let i = 0; i < bloques; i++) {
    const m = new Uint8Array(nonce.length + 4); m.set(nonce);
    new DataView(m.buffer).setUint32(nonce.length, i);
    tareas.push(crypto.subtle.sign("HMAC", kCif, m));
  }
  const flujo = await Promise.all(tareas), salida = new Uint8Array(datos.length);
  for (let i = 0; i < datos.length; i++) salida[i] = datos[i] ^ new Uint8Array(flujo[i >> 5])[i & 31];
  if (!paquete.z) return new TextDecoder().decode(salida);
  const flujoZ = new Blob([salida]).stream().pipeThrough(new DecompressionStream("deflate"));
  return await new Response(flujoZ).text();
}
function mostrar(pagina) { document.open(); document.write(pagina); document.close(); }
const CLAVE = "gd_lista_pw";
async function entrar(pw, recordar) {
  b.disabled = true; err.textContent = "";

    const pagina = await descifrar(PAQUETE, pw);
    if (pagina === null) {

      try { localStorage.removeItem(CLAVE); } catch (e) {}
